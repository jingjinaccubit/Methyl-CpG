name: Auto-update ClinVar Database

on:
  # Run automatically on the 1st day of every month at 03:00 UTC
  schedule:
    - cron: '0 3 1 * *'
  # Allow manual trigger with 1 click in GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clinvar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download & process latest ClinVar data
        run: python3 scripts/update_clinvar.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify build integrity
        run: |
          npm ci
          npm run build

      - name: Commit and push changes
        run: |
          git diff --quiet src/data/clinvarData.ts && echo "No ClinVar data changes detected." && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/clinvarData.ts
          git commit -m "chore(data): automated update of ClinVar database from NCBI FTP"
          git push origin main
